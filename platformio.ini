; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bogde/HX711@^0.7.5
	; fermino/gelf@^1.2.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.12.0
	bblanchon/ArduinoJson@^7.2.2
	ayushsharma82/ElegantOTA@^3.1.7
	vshymanskyy/Preferences@^2.2.2
	arduino-libraries/NTPClient@^3.2.1
	ayushsharma82/WebSerial@^2.1.2
	https://github.com/jeffminton/button.git
	https://github.com/jeffminton/Syslog.git
	arduinogetstarted/ezLED@^1.0.1
	; arcao/Syslog@^2.0.1
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
	colorize
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
build_flags = 
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-fno-exceptions
	-DCORE_DEBUG_LEVEL=4

[env:esp32dev_calibrate]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bogde/HX711@^0.7.5
	; fermino/gelf@^1.2.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.12.0
	bblanchon/ArduinoJson@^7.2.2
	ayushsharma82/ElegantOTA@^3.1.7
	vshymanskyy/Preferences@^2.2.2
	arduino-libraries/NTPClient@^3.2.1
	ayushsharma82/WebSerial@^2.1.2
	https://github.com/jeffminton/button.git
	https://github.com/jeffminton/Syslog.git
	arduinogetstarted/ezLED@^1.0.1
	; arcao/Syslog@^2.0.1
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
build_flags = 
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-DCALIBRATE=1
	-fno-exceptions

[env:esp32devota]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	bogde/HX711@^0.7.5
	; fermino/gelf@^1.2.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.12.0
	bblanchon/ArduinoJson@^7.2.2
	ayushsharma82/ElegantOTA@^3.1.7
	vshymanskyy/Preferences@^2.2.2
	arduino-libraries/NTPClient@^3.2.1
	ayushsharma82/WebSerial@^2.1.2
	https://github.com/jeffminton/button.git
	https://github.com/jeffminton/Syslog.git
	arduinogetstarted/ezLED@^1.0.1
	; arcao/Syslog@^2.0.1
monitor_speed = 115200
extra_scripts = platformio_upload.py
upload_protocol = custom
custom_upload_url = http://${secrets.ip_address}/update
upload_flags = 
	--auth=esp8266
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_compat_mode = strict
build_flags = 
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
	-fno-exceptions

