	; fermino/gelf@^1.2.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.12.0
	bblanchon/ArduinoJson@^7.2.2
	ayushsharma82/ElegantOTA@^3.1.7
	vshymanskyy/Preferences@^2.2.2
	arduino-libraries/NTPClient@^3.2.1
	ayushsharma82/WebSerial@^2.1.2
	https://github.com/jeffminton/button.git
	https://github.com/jeffminton/Syslog.git
